schemaVersion: 1
selectedId: salt-ledger-mystery
decisionRationale: 悬疑需求与历史关注度有行业数据支持，账术和官盐五痕提供了可连续兑现的职业破局机制；它比单纯追逐都市玄幻热点更符合作者已建立的证据型写作优势。
selectionTradeoff: 放弃戏曲末世更强的视觉改编感，也放弃银发治愈更大的题材空白，换取更明确的男频频道适配、开篇可验证钩子和三十章以上的稳定案件升级结构。
rejected:
  - id: opera-apocalypse
    reason: 市场活跃但同类传统文化加末世设定正在拥挤，作者对戏曲专业细节的储备尚不足以守住差异化。
  - id: silver-folk-healing
    reason: 更适合知乎盐选短篇完结路线，情感密度和题材空白突出；但本项目明确选择番茄男频长篇，不能把两种渠道与文体混在同一本书中。
validation:
  hypothesis: 喜欢历史悬疑与小人物升级的男频读者，会因账术破局的可回看证据和第三章被迫重做假账的钩子继续阅读。
  targetReaders: 最近一年持续阅读历史悬疑、官场博弈或专业破局网文的中文男频读者
  minimumSampleSize: 5
  successSignal: 五名盲测读者中至少四名能复述账术破局卖点，且至少三名明确选择立即阅读第四章。
protectedOriginality:
  - 不复制现有历史探案作品的案件、角色关系、组织、金手指或标志性表达
  - 所有破局证据必须能从官盐五痕、人物行动和已提交连续性中回看
  - 市场热度只决定验证优先级，不能替代作者判断和人物真实代价
