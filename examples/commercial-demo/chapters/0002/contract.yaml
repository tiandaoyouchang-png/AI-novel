readerPromise: 读者将看到“封印”这项看似权威的记录如何反而暴露造假时间。
keyTurn: 顾青昭并非来夺证，而是掌握沈砚三年前补假账的底稿，并需要他的账术。
netChange: 沈砚与顾青昭形成带把柄的临时联盟，获得第二件高风险物证。
endingPull: 义仓内骤然起火，火势从最潮湿、不该燃烧的盐垛底部窜出。
emotionalTarget: 沈砚从被顾青昭拿住把柄，转为接受一段仍可相互验证的低信任合作。
