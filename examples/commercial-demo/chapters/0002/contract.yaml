schemaVersion: 1
chapter: 2
title: 半枚火漆
goal: 沈砚必须带着青盐样本离开义仓，并在封仓令落下前找到能证明调包发生时间的第二类痕迹。
resistance: 顾青昭堵住唯一退路，以沈砚补假账的证据逼他合作；县衙差役正在逐袋复查封口。
requiredEvents:
  - 顾青昭表明自己受巡盐御史暗中差遣，但不交出完整密令。
  - 韩九制造一段可核验的巡夜时间差，帮助沈砚离仓。
  - 沈砚通过火漆温度和压印方向推断封条在雨夜刚被替换。
  - 两人取得半枚带无字凹痕的转运司火漆。
protectedFacts:
  - 沈砚持有青盐样本并承担盗盐风险。
  - 顾青昭不能凭身份合法化来路不明的官印。
  - 韩九的忠诚仍未确定。
prohibitedCrossings:
  - 不能让沈砚和顾青昭立即完全互信。
  - 不能揭露无字凹痕背后的最高层组织。
