schemaVersion: 2
chapter: 4
title: 请君重做假账
goal: 沈砚必须在县衙监视下重做一份能通过钦差初验、又暗藏可被外部核验破绽的总账。
resistance: 周嵩亲自限定账目口径，沈砚右手受伤，县丞安排两名书吏逐笔监看，任何明显暗号都会牵连韩九和脚夫。
requiredEvents:
  - 沈砚利用右手伤势争取由书吏代笔。
  - 周嵩给出一套表面合理的赈盐损耗解释。
  - 沈砚把三个异常袋号转译成可被沈禾识别的药方剂量。
  - 顾青昭必须在县衙外独立决定是否动用尚未公开的御史渠道。
protectedFacts:
  - 沈砚右掌烫伤且后背受伤。
  - 周嵩表面征用、实质控制沈砚。
  - 三个异常袋号已分散给脚夫记忆。
  - 沈砚仍持有火漆碎片与沈父残页。
prohibitedCrossings:
  - 不能让周嵩看不出普通的账目暗号。
  - 不能让顾青昭轻易调用公开官权解决困局。
  - 不能在本章击败周嵩或完成钦差验仓。
