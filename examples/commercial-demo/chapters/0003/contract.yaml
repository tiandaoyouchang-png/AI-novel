schemaVersion: 2
chapter: 3
title: 火里留哪一本账
goal: 沈砚必须在义仓坍塌前救出韩九，并保住足以让调包案继续被查的证据。
resistance: 火势从盐垛底部蔓延，官差只顾搬走总账，顾青昭要求优先保全物证，沈砚无法同时带走韩九、账册和全部样本。
requiredEvents:
  - 沈砚利用盐垛重量与仓梁结构判断一条短暂安全路线。
  - 顾青昭独立承担暴露风险，阻止差役封死仓门。
  - 沈砚选择先救韩九，并用可复制的袋号和巡夜记录替代唯一账本。
  - 韩九交出沈父夜航簿的一页，指向赈盐被转去城外难民营的反向货路。
  - 县令周嵩以协助查账为名当众召见沈砚。
protectedFacts:
  - 火漆碎片仍由沈砚持有。
  - 顾青昭与沈砚只是低信任合作。
  - 韩九帮助过沈砚但仍可能隐瞒事实。
prohibitedCrossings:
  - 不能让火灾一次性销毁所有可查痕迹。
  - 不能让周嵩公开承认参与赈盐案。
  - 不能让沈砚靠巧合毫发无伤地救人。
participants:
