schemaVersion: 2
chapter: 1
title: 义仓里的青盐
goal: 沈砚必须在天亮封仓前确认义仓盐袋为何比官账轻，并决定是否保留证据。
resistance: 仓门已被县衙封条锁住，韩九在门外巡夜，而沈砚本人参与补过这批赈盐的账。
requiredEvents:
  - 沈砚用账术和现场痕迹确认盐袋被调包。
  - 袋底出现来自禁运北泽盐场的青盐。
  - 仓外咳嗽让沈砚认出更夫韩九。
  - 沈砚主动藏下一粒青盐并抄走异常袋号。
protectedFacts:
  - 沈砚没有超自然能力。
  - 韩九咳嗽带铜哨音。
  - 钦差将在次日午前验仓。
prohibitedCrossings:
  - 不能直接揭露县令是幕后主使。
  - 不能让沈砚无代价带走整本官账。
