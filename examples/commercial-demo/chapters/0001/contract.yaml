readerPromise: 读者将看到沈砚如何从重量与封口的矛盾中找出第一条可验证证据。
keyTurn: 沈砚发现异常不是仓吏偷斤短两，而是有人用南盐外皮包进禁运青盐。
netChange: 沈砚从可能的旁观者变成私藏证据的涉案者。
endingPull: 仓外熟悉的咳嗽停住，有人准确叫出沈砚的小名。
emotionalTarget: 沈砚从害怕旧错暴露，转为主动承担私藏证据的风险。
